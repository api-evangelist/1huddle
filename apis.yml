aid: 1huddle
name: 1Huddle
description: >-
  1Huddle is a Newark, New Jersey workforce training platform that uses
  science-backed, quick-burst mobile games to onboard, upskill, and engage
  employees. Founded by Sam Caucci, the platform offers a mobile library of
  3,000+ skill games across 16 workforce skill areas, an on-demand game
  marketplace, and personalized content, with clients including Loews Hotels,
  Novartis, Madison Square Garden, PIMCO, and the U.S. Air Force. 1Huddle
  integrates with LMS, HRIS, authoring, and reporting tools (Microsoft Teams,
  Slack, Workday, Salesforce, Cornerstone, and more) and exposes flexible SSO,
  User Feeds, and Reporting APIs through a partner program rather than a public
  self-service developer portal. Surfaced as a portfolio company of 500 Global
  and profiled in the API Evangelist network.
